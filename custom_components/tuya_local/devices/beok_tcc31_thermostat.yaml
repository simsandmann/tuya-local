name: Thermostat
products:
  - id: zy2codiyo9yfjblh
    manufacturer: Beok
    model: TCC31
entities:
  - entity: climate
    translation_only_key: thermostat
    dps:
      - id: 1
        type: boolean
        name: hvac_mode
        mapping:
          - dps_val: false
            value: "off"
          - dps_val: true
            constraint: preset_mode
            conditions:
              - dps_val: auto
                value: auto
              - dps_val: temporary
                value: auto
                hidden: true
              - dps_val: home
                value: heat
      - id: 2
        type: integer
        name: temperature
        unit: C
        range:
          min: 50
          max: 950
        mapping:
          - scale: 10
            step: 5
            constraint: temperature_unit
            conditions:
              - dps_val: f
                step: 10
      - id: 3
        type: integer
        name: current_temperature
        mapping:
          - scale: 10
      - id: 4
        type: string
        name: preset_mode
        mapping:
          - dps_val: home
            value: manual
          - dps_val: auto
            value: program
          - dps_val: temporary
            value: temp_override
      - id: 5
        type: string
        name: hvac_action
        mapping:
          - dps_val: "0"
            value: idle
          - dps_val: "1"
            value: heating
      - id: 12
        type: string
        name: temperature_unit
        mapping:
          - dps_val: c
            value: C
          - dps_val: f
            value: F
      - id: 15
        type: integer
        name: max_temperature
  - entity: lock
    translation_key: child_lock
    category: config
    dps:
      - id: 9
        type: boolean
        name: lock
  - entity: binary_sensor
    class: problem
    category: diagnostic
    dps:
      - id: 11
        type: bitfield
        name: sensor
        mapping:
          - dps_val: 0
            value: false
          - value: true
      - id: 11
        type: bitfield
        name: fault_code
  - entity: binary_sensor
    class: window
    dps:
      - id: 107
        type: string
        name: sensor
        optional: true
        mapping:
          - dps_val: opened
            value: true
          - dps_val: closed
            value: false
  - entity: select
    translation_key: temperature_unit
    category: config
    dps:
      - id: 12
        type: string
        name: option
        mapping:
          - dps_val: c
            value: celsius
          - dps_val: f
            value: fahrenheit
  - entity: number
    translation_key: maximum_temperature
    category: config
    class: temperature
    dps:
      - id: 15
        type: integer
        name: value
        unit: C
        range:
          min: 15
          max: 95
  - entity: number
    translation_key: temperature_calibration
    category: config
    class: temperature_delta
    dps:
      - id: 19
        type: integer
        name: value
        unit: C
        range:
          min: -99
          max: 99
        mapping:
          - scale: 10
  - entity: number
    name: Temperature hysteresis
    category: config
    class: temperature_delta
    icon: "mdi:thermometer-plus"
    dps:
      - id: 101
        type: integer
        name: value
        unit: C
        range:
          min: 5
          max: 100
        mapping:
          - scale: 10
            step: 5
  - entity: number
    name: External temperature limit
    category: config
    class: temperature
    icon: "mdi:arrow-collapse-up"
    dps:
      - id: 102
        type: integer
        name: value
        unit: C
        range:
          min: 25
          max: 95
  - entity: switch
    translation_key: anti_frost
    category: config
    dps:
      - id: 103
        type: boolean
        name: switch
  - entity: switch
    name: Open window detection
    category: config
    icon: "mdi:window-open-variant"
    dps:
      - id: 106
        type: boolean
        name: switch
  - entity: switch
    translation_key: sound
    category: config
    dps:
      - id: 109
        type: boolean
        name: switch
  - entity: select
    name: Sensor selection
    category: config
    icon: "mdi:home-thermometer"
    dps:
      - id: 110
        type: string
        name: option
        mapping:
          - dps_val: "1"
            value: Internal
          - dps_val: "2"
            value: External
          - dps_val: "3"
            value: Both
  - entity: switch
    translation_key: night_mode
    category: config
    dps:
      - id: 111
        type: boolean
        name: switch
